<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RV SHADOW API by Rocky Chowdhury</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0033, #3d0a4f, #5c0f6b, #1a0033);
      background-size: 300% 300%;
      animation: bgShift 10s ease infinite;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Hacker-style pink matrix rain */
    #matrixCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    /* Floating decorative emojis */
    .floaties {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floaties span {
      position: absolute;
      bottom: -40px;
      font-size: 22px;
      opacity: 0.55;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }

    .container { max-width: 650px; margin: 0 auto; position: relative; z-index: 1; }

    /* Welcome splash screen */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3d0a4f 0%, #1a0033 75%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,105,220,0.6);
      box-shadow: 0 0 40px rgba(255,20,147,0.7);
      animation: splashPop 0.7s cubic-bezier(.34,1.56,.64,1) both,
                 floatLogo 3.5s ease-in-out infinite 0.7s,
                 glow 2.5s ease-in-out infinite 0.7s;
    }
    @keyframes splashPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    #splash h2 {
      margin-top: 24px;
      font-size: 26px;
      font-weight: 800;
      min-height: 34px;
      background: linear-gradient(90deg, #ff6fd8, #ff2d95, #ff9ff3, #ff6fd8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      text-align: center;
      letter-spacing: 0.5px;
      opacity: 0;
    }
    #splash h2.visible { opacity: 1; }
    #splash h2 .cursor {
      -webkit-text-fill-color: #ff9ff3;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    #splash p {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
      color: rgba(255,182,230,0.75);
      text-align: center;
      padding: 0 30px;
      opacity: 0;
    }
    #splash p.visible { opacity: 1; }
    #splash .splash-dots {
      margin-top: 22px;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #splash .splash-dots.visible { opacity: 1; }
    #splash .splash-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff6fd8;
      animation: dotBounce 1s ease-in-out infinite;
    }
    #splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotBounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-8px); opacity: 1; }
    }

    #splash .view-btn {
      margin-top: 26px;
      padding: 13px 38px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff2d95, #ff6fd8, #ff9ff3, #ff2d95);
      background-size: 300% auto;
      color: white;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 0 20px rgba(255,45,149,0.5);
      animation: shine 4s linear infinite;
    }
    #splash .view-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #splash .view-btn:hover {
      box-shadow: 0 0 35px rgba(255,45,149,0.85);
      transform: scale(1.06);
    }
    #splash .view-btn:active { transform: scale(0.96); }

    header { text-align: center; padding: 40px 0 30px; animation: fadeInDown 0.8s ease; }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,105,220,0.5);
      box-shadow: 0 0 25px rgba(255,20,147,0.6);
      animation: floatLogo 3.5s ease-in-out infinite, glow 2.5s ease-in-out infinite;
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,20,147,0.45); }
      50% { box-shadow: 0 0 40px rgba(255,0,200,0.85); }
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff6fd8, #ff2d95, #ff9ff3, #ff6fd8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 14px 0 6px;
      animation: shine 3s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
    header p {
      color: rgba(255,182,230,0.7);
      font-size: 14px;
      animation: fadeInUp 0.7s ease 0.15s both;
    }
    .badge {
      display: inline-block;
      background: rgba(255,105,220,0.1);
      border: 1px solid rgba(255,105,220,0.3);
      border-radius: 50px;
      padding: 4px 14px;
      font-size: 12px;
      color: #ff6fd8;
      margin-top: 10px;
      animation: fadeInUp 0.7s ease 0.3s both, pulse 1.8s ease-in-out 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .card {
      background: rgba(255,105,220,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,105,220,0.18);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      animation: fadeInUp 0.7s ease both;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,45,149,0.6);
      box-shadow: 0 0 25px rgba(255,45,149,0.25);
    }
    .card:nth-of-type(1) { animation-delay: 0.05s; }
    .card:nth-of-type(2) { animation-delay: 0.15s; }
    .card:nth-of-type(3) { animation-delay: 0.25s; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ff6fd8;
      margin-bottom: 16px;
      animation: fadeInUp 0.6s ease both;
    }
    .total-box { text-align: center; padding: 10px; }
    .total-box .number {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff2d95, #ff9ff3, #ff2d95);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      display: inline-block;
    }
    .total-box .label {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      animation: fadeInUp 0.6s ease 0.1s both;
    }

    /* Add form */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,105,220,0.25);
      background: rgba(255,105,220,0.07);
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row input:focus {
      border-color: #ff2d95;
      box-shadow: 0 0 0 3px rgba(255,45,149,0.2);
    }
    .input-row input::placeholder { color: rgba(255,182,230,0.4); }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff2d95, #ff6fd8);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; transform: scale(1.04); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-full {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
    }
    .msg {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      animation: fadeInUp 0.3s ease;
    }
    .msg.success { background: rgba(255,105,220,0.15); color: #ff9ff3; border: 1px solid rgba(255,105,220,0.35); }
    .msg.error { background: rgba(255,45,110,0.15); color: #ff6f9c; border: 1px solid rgba(255,45,110,0.35); }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .video-item {
      background: rgba(30,0,25,0.4);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,105,220,0.15);
      position: relative;
      animation: fadeInUp 0.5s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .video-item:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 22px rgba(255,45,149,0.35);
    }
    .video-item video {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .video-item .video-num {
      position: absolute;
      top: 6px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      color: #ff6fd8;
    }
    .load-more {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border: 1px solid rgba(255,105,220,0.2);
      border-radius: 10px;
      background: rgba(255,105,220,0.05);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .load-more:hover { background: rgba(255,105,220,0.12); transform: scale(1.02); }
    .empty { text-align: center; color: rgba(255,182,230,0.35); padding: 20px; font-size: 14px; }

    footer {
      text-align: center;
      padding: 30px 0 20px;
      font-size: 12px;
      color: rgba(255,182,230,0.4);
      animation: fadeInUp 0.7s ease both;
    }
    footer a { color: #ff6fd8; text-decoration: none; }
    #footerText {
      display: inline-block;
      animation: footerGlow 3s ease-in-out infinite;
    }
    @keyframes footerGlow {
      0%, 100% { color: rgba(255,182,230,0.4); }
      50% { color: rgba(255,111,216,0.9); }
    }
  </style>
</head>
<body>

<!-- Welcome splash screen -->
<div id="splash">
  <img class="splash-logo" src="https://i.imgur.com/6sDv1tF.jpeg" alt="RV Shadow API Logo" />
  <h2 id="splashTitle"></h2>
  <p id="splashSubtitle"></p>
  <div class="splash-dots" id="splashDots"><span></span><span></span><span></span></div>
  <button class="view-btn" id="viewBtn">View Site 💫</button>
</div>

<!-- Pink hacker-style matrix rain -->
<canvas id="matrixCanvas"></canvas>

<!-- Floating decorative emojis -->
<div class="floaties" id="floaties"></div>

<div class="container">

  <!-- Header -->
  <header>
    <img class="logo" src="https://i.imgur.com/6sDv1tF.jpeg" alt="RV Shadow API Logo" />
    <h1>🎬✨ RV SHADOW API 💖✨</h1>
    <p>💌🌸 Random Video API — Crafted by Rocky Chowdhury 💫🦋</p>
    <span class="badge">🟢 Live 🔥</span>
  </header>

  <!-- Total count -->
  <div class="card">
    <h2>📊 Total Videos 💎</h2>
    <div class="total-box">
      <div class="number" id="totalCount">...</div>
      <div class="label">✨🌟 Videos Available 🌟✨</div>
    </div>
  </div>

  <!-- Add video -->
  <div class="card">
    <h2>➕✨ Add New Video 🌟💕</h2>
    <div class="input-row">
      <input type="text" id="videoUrl" placeholder="https://i.imgur.com/xxx.mp4" />
    </div>
    <div class="input-row">
      <input type="password" id="secretKey" placeholder="Enter secret key 🔑" />
      <button class="btn" onclick="addVideo()">Add 💫🎀</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>

  <!-- Video list -->
  <div class="card">
    <h2>🎬💖 All Videos 💖🎬</h2>
    <div class="video-grid" id="videoGrid">
      <div class="empty">Loading... ⏳✨</div>
    </div>
    <button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">
      ✨🎀 Show More 🎀✨
    </button>
  </div>

  <footer>
    <span id="footerText">© 2026 Rocky Chowdhury 💌🌸</span>
  </footer>

</div>

<script>
  let allVideos = [];
  let shown = 6;

  // Sprinkle LOTS of floating decorative emojis across the background
  (function spawnFloaties() {
    const emojis = [
      "💌", "✨", "💫", "🌟", "💖", "🎬", "💕", "💓", "💗", "💞",
      "🌸", "🎀", "💎", "🔥", "🦋", "🌺", "💝", "⭐", "🪄", "🌷",
      "💘", "🎉", "🌈", "💟", "🩷"
    ];
    const wrap = document.getElementById("floaties");
    const count = 45;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (14 + Math.random() * 16) + "px";
      const duration = 8 + Math.random() * 16;
      el.style.animationDuration = duration + "s";
      el.style.animationDelay = (Math.random() * duration) + "s";
      wrap.appendChild(el);
    }
  })();

  // Pink "hacker" matrix rain effect
  (function matrixRain() {
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    let width, height, columns, drops;
    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン♥✧☆彡";
    const fontSize = 16;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops = new Array(columns).fill(1);
    }
    window.addEventListener("resize", resize);
    resize();

    function draw() {
      ctx.fillStyle = "rgba(20,0,20,0.12)";
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, "#ff9ff3");
        grad.addColorStop(1, "#ff2d95");
        ctx.fillStyle = grad;
        ctx.font = fontSize + "px monospace";
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();

  // Typewriter effect for the splash screen
  function typeText(el, text, speed) {
    return new Promise((resolve) => {
      el.classList.add("visible");
      let i = 0;
      el.innerHTML = '<span class="cursor">|</span>';
      const timer = setInterval(() => {
        i++;
        el.innerHTML = text.slice(0, i) + '<span class="cursor">|</span>';
        if (i >= text.length) {
          clearInterval(timer);
          resolve();
        }
      }, speed);
    });
  }

  async function runSplashSequence() {
    const title = document.getElementById("splashTitle");
    const subtitle = document.getElementById("splashSubtitle");
    const dots = document.getElementById("splashDots");
    const viewBtn = document.getElementById("viewBtn");

    await typeText(title, "Welcome to RV Shadow API", 45);
    title.innerHTML = "Welcome to RV Shadow API";
    dots.classList.add("visible");

    await typeText(subtitle, "Loading your videos, please wait...", 30);
    subtitle.innerHTML = "Loading your videos, please wait...";

    await loadVideos();

    dots.classList.remove("visible");
    subtitle.innerHTML = "Everything is ready for you!";
    viewBtn.classList.add("visible");
  }

  window.onload = () => {
    runSplashSequence();
    document.getElementById("viewBtn").addEventListener("click", () => {
      document.getElementById("splash").classList.add("hide");
    });
  };

  async function loadVideos() {
    try {
      const res = await fetch("/api/list");
      const data = await res.json();
      document.getElementById("totalCount").textContent = data.total;
    } catch(e) {
      document.getElementById("totalCount").textContent = "?";
    }

    try {
      // Load all videos from GitHub
      const res = await fetch("https://raw.githubusercontent.com/oldacountrocky303-ship-it/rv-api/main/data/videos.json");
      allVideos = await res.json();
      renderVideos();
    } catch(e) {
      document.getElementById("videoGrid").innerHTML = '<div class="empty">Failed to load videos 😢</div>';
    }
  }

  function renderVideos() {
    const grid = document.getElementById("videoGrid");
    const loadBtn = document.getElementById("loadMoreBtn");

    if (allVideos.length === 0) {
      grid.innerHTML = '<div class="empty">No videos available yet 😔</div>';
      return;
    }

    const toShow = allVideos.slice(0, shown);
    grid.innerHTML = toShow.map((v, i) => `
      <div class="video-item" style="animation-delay: ${i * 0.06}s">
        <video src="${v.url}" controls muted playsinline></video>
        <div class="video-num">✨ #${i + 1}</div>
      </div>
    `).join("");

    loadBtn.style.display = shown < allVideos.length ? "block" : "none";
  }

  function loadMore() {
    shown += 6;
    renderVideos();
  }

  async function addVideo() {
    const videoUrl = document.getElementById("videoUrl").value.trim();
    const secret = document.getElementById("secretKey").value.trim();
    const msg = document.getElementById("addMsg");

    if (!videoUrl || !secret) {
      showMsg("⚠️ Please enter a video link and secret key!", "error");
      return;
    }

    showMsg("⏳ Adding...", "success");

    try {
      const res = await fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ videoUrl, secret })
      });

      const data = await res.json();

      if (data.success) {
        showMsg(`✅ Video added successfully! Total: ${data.total} 🎉`, "success");
        document.getElementById("videoUrl").value = "";
        await loadVideos();
      } else {
        showMsg(`❌ ${data.error}`, "error");
      }
    } catch(e) {
      showMsg("❌ Error: " + e.message, "error");
    }
  }

  function showMsg(text, type) {
    const msg = document.getElementById("addMsg");
    msg.textContent = text;
    msg.className = `msg ${type}`;
    msg.style.display = "block";
  }
</script>
</body>
</html>
